version: "3.8"

services:
  synergy-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:80"
      - "5001:443"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__OperativeModelContainer=metadata=res://*/Models.Operative.OperativeModel.csdl|res://*/Models.Operative.OperativeModel.ssdl|res://*/Models.Operative.OperativeModel.msl;provider=System.Data.SqlClient;provider connection string="Data Source=db;Initial Catalog=Pathway;User ID=PathwayUser;Password=Synergy2017;MultipleActiveResultSets=True"
      - ConnectionStrings__Pathway=metadata=res://*/PathwayEntities.csdl|res://*/PathwayEntities.ssdl|res://*/PathwayEntities.msl;provider=System.Data.SqlClient;provider connection string="data source=db;initial catalog=Pathway;integrated security=False;User Id=PathwayUser;password=Synergy2014;multipleactiveresultsets=True;App=SynergyAPI"
      - AppSettings__HmacSecret=Steris2020
      - AppSettings__DataCentrePrefix=U
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - synergy-api-logs:/app/logs
    networks:
      - synergy-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=P@sswOrd123
    volumes:
      - sqlserver-data:/var/opt/mssql
    restart: unless-stopped
    networks:
      - synergy-network
    healthcheck:
      test: ["CMD", "sqlcmd", "-S", "localhost", "-U", "SA", "-P", "P@sswOrd123", "-Q", "SELECT 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  sqlserver-data:
  synergy-api-logs:

networks:
  synergy-network:
    driver: bridge